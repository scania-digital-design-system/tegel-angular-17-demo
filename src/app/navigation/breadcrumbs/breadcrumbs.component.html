@if (segments.length > 1 && segments[1].path !== '/web-components') {
  <div class="breadcrumbs tds-u-ml3">
    <tds-breadcrumbs>
      @for (segment of segments; track segment; let idx = $index; let isLast = $last) {
        <tds-breadcrumb [current]="isLast">
          <a class="capitalize" [routerLink]="segment.path">{{ segment.title }}</a>
        </tds-breadcrumb>
      }
    </tds-breadcrumbs>
  </div>
}
