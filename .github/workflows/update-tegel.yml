name: Update Tegel Dependency

on:
  schedule:
    - cron: '0 14 * * THU'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  update-tegel:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        env: 
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        env: 
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
        with:
          node-version: '22'

      - name: Get latest stable Tegel versions from npm
        id: latest_versions
        run: |
          ANGULAR=$(pnpm view @scania/tegel-angular-17 dist-tags.latest)
          CORE=$(pnpm view @scania/tegel dist-tags.latest)

          echo "angular=$ANGULAR" >> $GITHUB_OUTPUT
          echo "core=$CORE" >> $GITHUB_OUTPUT

      - name: Get current Tegel versions from package.json
        id: current_versions
        run: |
          ANGULAR=$(node -p "require('./package.json').dependencies['@scania/tegel-angular-17']")
          CORE=$(node -p "require('./package.json').dependencies['@scania/tegel']")

          echo "angular=$ANGULAR" >> $GITHUB_OUTPUT
          echo "core=$CORE" >> $GITHUB_OUTPUT

      - name: Compare versions
        id: compare
        run: |
          LATEST_ANGULAR="${{ steps.latest_versions.outputs.angular }}"
          CURRENT_ANGULAR="${{ steps.current_versions.outputs.angular }}"

          if [ "$LATEST_ANGULAR" = "$CURRENT_ANGULAR" ]; then
            echo "up_to_date=true" >> $GITHUB_OUTPUT
            echo "Tegel is already up to date (@scania/tegel-angular-17: $CURRENT_ANGULAR)"  
          else
            echo "up_to_date=false" >> $GITHUB_OUTPUT
            echo "@scania/tegel-angular-17: $CURRENT_ANGULAR -> $LATEST_ANGULAR"
          fi

      - name: Update package.json with exact versions
        if: steps.compare.outputs.up_to_date == 'false'
        run: |
          sed -i 's|"@scania/tegel-angular-17": "${{ steps.current_versions.outputs.angular }}"|"@scania/tegel-angular-17": "${{ steps.latest_versions.outputs.angular }}"|' package.json
          sed -i 's|"@scania/tegel": "${{ steps.current_versions.outputs.core }}"|"@scania/tegel": "${{ steps.latest_versions.outputs.core }}"|' package.json

      - name: Update pnpm-lock.yaml
        if: steps.compare.outputs.up_to_date == 'false'
        run: pnpm install --lockfile-only

      - name: Open Pull Request
        if: steps.compare.outputs.up_to_date == 'false'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: chore/update-tegel-${{ steps.latest_versions.outputs.angular }}
          commit-message: 'chore: update tegel to ${{ steps.latest_versions.outputs.angular }}'
          title: 'chore: update @scania/tegel-angular-17 ${{ steps.current_versions.outputs.angular }} → ${{ steps.latest_versions.outputs.angular }}'
          body: |
            ## Tegel dependency update

            | Package | Before | After |
            | --- | --- | --- |
            | @scania/tegel-angular-17 | `${{ steps.current_versions.outputs.angular }}` | `${{ steps.latest_versions.outputs.angular }}` |
            | @scania/tegel | `${{ steps.current_versions.outputs.core }}` | `${{ steps.latest_versions.outputs.core }}` |

            This PR was opened automatically by the update-tegel workflow.
          base: main
          labels: dependencies
